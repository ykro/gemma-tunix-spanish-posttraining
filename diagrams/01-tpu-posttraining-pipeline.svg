<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tpu-posttraining-pipeline-title tpu-posttraining-pipeline-desc" id="d-01-tpu-posttraining-pipeline-root">
        <title id="tpu-posttraining-pipeline-title">Pipeline On-Demand de Post-Training estilo Gemma en Español</title>
        <desc id="tpu-posttraining-pipeline-desc">Arquitectura del pipeline on-demand en Cloud TPU v5e que aprovisiona el mesh XLA, inyecta adaptadores LoRA en Gemma sobre Flax NNX, alinea con GRPO y destruye la VM mediante trap EXIT.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-tpu-posttraining-pipeline-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-01-tpu-posttraining-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-01-tpu-posttraining-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-tpu-posttraining-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-01-tpu-posttraining-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/>
          </marker>
          <marker id="d-01-tpu-posttraining-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#C59216"/>
          </marker>
          <marker id="d-01-tpu-posttraining-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0F2547"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>

        <!-- Ephemeral Cloud TPU v5e Zone Container -->
        <rect x="260" y="36" width="432" height="392" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="276" y="56" fill="#3B5B8C" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ON-DEMAND CLOUD TPU V5E VM · SCRIPT (CIFRAS EN CPU SIMULADO)</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- 1. CLI Orchestrator -> Gemma Base in Flax NNX -->
        <line x1="184" y1="136" x2="276" y2="136" stroke="#3B5B8C" stroke-width="1.4" marker-end="url(#d-01-tpu-posttraining-pipeline-arrow)"/>
        <rect x="192" y="116" width="60" height="12" rx="2" fill="#F7F6F2"/>
        <text x="222" y="125" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROVISION</text>

        <!-- 2. GCS Corpus -> Surgical LoRA Adapter -->
        <line x1="184" y1="320" x2="276" y2="320" stroke="#3B5B8C" stroke-width="1.4" marker-end="url(#d-01-tpu-posttraining-pipeline-arrow)"/>
        <rect x="196" y="300" width="52" height="12" rx="2" fill="#F7F6F2"/>
        <text x="222" y="309" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPTS</text>

