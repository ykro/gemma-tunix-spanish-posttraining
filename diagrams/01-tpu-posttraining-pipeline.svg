        <rect x="700" y="332" width="52" height="12" rx="2" fill="#F7F6F2"/>
        <text x="726" y="341" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECKPT</text>

