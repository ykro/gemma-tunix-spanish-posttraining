        <rect x="276" y="272" width="176" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="276" y="272" width="176" height="96" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
        <rect x="288" y="280" width="40" height="12" rx="2" fill="none" stroke="#C59216" stroke-width="0.8"/>
        <text x="308" y="289" fill="#9A6F0B" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LORA</text>
